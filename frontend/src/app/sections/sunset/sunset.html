<section #section id="contacto" class="section" aria-labelledby="contacto-title">
  <app-section-heading time="18:00" [heading]="contact.title" headingId="contacto-title" />
  <p>{{ contact.text }}</p>
  <!-- El formulario se descarga aparte, cuando el navegador queda libre tras cargar la pagina. -->
  @defer (on idle) {
    <app-contact-form />
  } @placeholder {
    <div class="form-placeholder"></div>
  }
  <p class="alternatives">{{ contact.alternativesText }}</p>
  <ul class="links">
    <li>
      <a class="icon-link" [href]="'mailto:' + contact.email">
        <app-icon name="mail" />
        <span>{{ contact.email }}</span>
      </a>
    </li>
    @if (contact.linkedinUrl; as linkedinUrl) {
      <li>
        <a class="icon-link" [href]="linkedinUrl" target="_blank" rel="noopener noreferrer">
          <app-icon name="linkedin" />
          <span>LinkedIn<span class="sr-only"> (se abre en una pestaña nueva)</span></span>
        </a>
      </li>
    }
    @if (contact.cvUrl; as cvUrl) {
      <li><a [href]="cvUrl" download>Descargar CV</a></li>
    }
  </ul>
</section>
