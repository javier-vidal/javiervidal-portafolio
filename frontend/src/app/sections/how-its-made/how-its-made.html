<section id="bajo-el-capo" class="section" aria-labelledby="bajo-el-capo-title">
  <app-section-heading time="21:00" [heading]="section.title" [intro]="section.intro" headingId="bajo-el-capo-title" />

  <dl class="details">
    @for (detail of details; track detail.label) {
      <div>
        <dt>{{ detail.label }}</dt>
        <dd>{{ detail.text }}</dd>
      </div>
    }
  </dl>

  <h3>Lighthouse</h3>
  <dl class="scores">
    @for (item of scores; track item.label) {
      <div class="card">
        <dt class="muted">{{ item.label }}</dt>
        <dd>{{ item.score ?? 'Pendiente' }}</dd>
      </div>
    }
  </dl>
  <p class="scores-note muted">
    {{ scoresNote }} ·
    <a [href]="pagespeedLink.href" target="_blank" rel="noopener noreferrer">
      {{ pagespeedLink.label }}<span class="sr-only"> (se abre en una pestaña nueva)</span>
    </a>
  </p>

  <p>
    <a class="icon-link" [href]="repoLink.href" rel="noopener">
      <app-icon name="github" />
      <span>{{ repoLink.label }}</span>
    </a>
  </p>
</section>
