<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada · Javier Vidal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root {
      --bg: #fbe5d6;
      --text: #1f2a33;
      --text-muted: #4a5863;
      --accent: #9c3a29;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0b1420;
        --text: #e6edf3;
        --text-muted: #a9b6c2;
        --accent: #f2b880;
      }
    }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: 1rem;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 32rem;
    }

    .time {
      margin: 0;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    h1 {
      margin: 0.25rem 0 0;
      font-size: 2rem;
      line-height: 1.2;
    }

    p {
      color: var(--text-muted);
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p class="time">404</p>
    <h1>Te saliste de la ruta</h1>
    <p>La página que buscas no existe o cambió de lugar.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
